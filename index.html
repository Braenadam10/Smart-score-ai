<script>
// TAMBAHAN BARU: Auto-suggest semua tim
let timeoutSearch;
document.getElementById("tim1").addEventListener("input", (e)=>suggest(e,1));
document.getElementById("tim2").addEventListener("input", (e)=>suggest(e,2));

async function suggest(e, n){
  clearTimeout(timeoutSearch);
  let q = e.target.value;
  if(q.length < 2) return;
  timeoutSearch = setTimeout(async ()=>{
    try{
      let res = await fetch(`https://www.thesportsdb.com/api/v1/json/1/searchteams.php?t=${encodeURIComponent(q)}`);
      let json = await res.json();
      if(!json.teams) return;
      // Buat list saran di bawah input
      let listId = "list"+n;
      let old = document.getElementById(listId);
      if(old) old.remove();
      let div = document.createElement("div");
      div.id = listId;
      div.style.cssText="background:white;color:black;border-radius:8px;max-height:150px;overflow:auto;text-align:left;margin-top:-5px";
      json.teams.slice(0,5).forEach(t=>{
        let item = document.createElement("div");
        item.style.cssText="padding:8px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #eee";
        item.innerHTML=`<img src="${t.strTeamBadge}" style="width:25px;height:25px"> ${t.strTeam} - ${t.strCountry}`;
        item.onclick=()=>{document.getElementById("tim"+n).value=t.strTeam; div.remove();};
        div.appendChild(item);
      });
      document.getElementById("tim"+n).after(div);
    }catch(e){}
  }, 400);
}
</script>
